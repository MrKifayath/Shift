version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pomodoro-postgres
    environment:
      POSTGRES_DB: pomodoro_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pomodoro-network

  redis:
    image: redis:7-alpine
    container_name: pomodoro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pomodoro-network

  # Uncomment these services when ready to use Docker
